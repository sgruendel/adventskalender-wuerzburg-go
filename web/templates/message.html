{{define "title"}}{{.Title}}{{end}}

{{define "content"}}
<h1>{{.Title}}</h1>
{{range .Paragraphs}}<p>{{.}}</p>
{{end}}
{{if .Action -}}
<form method="post" action="{{.Action}}">
  <input type="hidden" name="token" value="{{.Token}}">
  <button type="submit">{{.Button}}</button>
</form>
{{- end}}
<p class="back"><a href="/">Zur Startseite</a></p>
{{end}}
